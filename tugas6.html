        /* Kotak luar tipis mirip seperti yang ada di gambar tugas */
        .wrapper {
            border: 1px solid #777777;
            padding: 20px;

            min-height: 250px;

        /* Mengatur tabel agar tidak memunculkan garis border */
        table {
            border-collapse: collapse;

        }

        /* Mengatur jarak dan ukuran font teks agar rapi */
        td {
            padding: 6px 4px;
            font-size: 1.15rem;
            vertical-align: top; /* Supaya titik dua dan isi hobi sejajar pas di atas */
            color: #000000;
        }

        /* Mengatur style list/bullet point untuk bagian Hobby */
        td ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
